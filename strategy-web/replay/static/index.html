<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOEX Bar Replay · TradingView</title>
  <link rel="stylesheet" href="/static/replay.css?v=20260717c" />
</head>
<body>
  <div id="loading" class="loading">
    <div id="loadingTitle">Загрузка 15м данных…</div>
    <div class="loading-sub" id="loadingSub">подключение к http://127.0.0.1:8765</div>
  </div>

  <div class="app hidden" id="app">
    <header class="toolbar">
      <h1>MOEX Bar Replay</h1>
      <span class="meta" id="meta">TATN/TATNP · 15м</span>
      <label class="meta">Старт
        <input type="date" id="startDate" />
      </label>
      <span class="meta">Период:</span>
      <div class="chip-group" id="periodChips">
        <button type="button" class="chip active" data-days="30">30д</button>
        <button type="button" class="chip" data-days="90">3М</button>
        <button type="button" class="chip" data-days="180">6М</button>
        <button type="button" class="chip" data-days="400">Всё</button>
      </div>
      <label class="meta">Вх ±
        <select id="entrySel"></select>
      </label>
      <label class="meta">Вых ±
        <select id="exitSel"></select>
      </label>
      <label class="meta">Капитал ₽
        <input type="number" id="notionalSel" min="1000" max="10000000" step="1000" value="10000" />
      </label>
      <label class="meta">CSV
        <select id="csvSel">
          <option value="m15_tatn_255d.csv" selected>255д</option>
          <option value="m15_tatn_365d.csv">365д</option>
          <option value="m15_test_3d.csv">тест 3д</option>
        </select>
      </label>
    </header>

    <div class="status-bar" id="status">—</div>

    <main class="main" id="mainSplit">
      <div class="chart-wrap">
        <div class="chart-stack" id="chartStack">
          <div class="chart-pane-z-wrap">
            <div id="openTradeOverlay" class="open-trade-overlay hidden"></div>
            <div id="chart" class="chart-pane-z"></div>
          </div>
          <div class="split-divider-h" id="deltaSplitDividerH" role="separator" aria-orientation="horizontal" aria-label="Высота графиков Z / Дельта ПП" title="Перетащите · двойной клик — сброс"></div>
          <div class="delta-wrap" id="deltaPane">
            <div class="pnl-head">
              <div class="pnl-label" id="deltaLabel">Дельта ПП · изменение по сделке</div>
            </div>
            <div id="deltaChart" class="chart-pane-delta"></div>
          </div>
          <div class="split-divider-h" id="chartSplitDividerH" role="separator" aria-orientation="horizontal" aria-label="Высота графиков Дельта / PnL" title="Перетащите · двойной клик — сброс"></div>
          <div class="pnl-wrap" id="pnlPane">
            <div class="pnl-head">
              <div class="pnl-label" id="pnlLabel">PnL · % от вложения</div>
              <div class="chip-group pnl-mode-chips" id="pnlModeChips">
                <button type="button" class="chip active" data-pnl-mode="total">Общий</button>
                <button type="button" class="chip" data-pnl-mode="trade">Сделка</button>
              </div>
            </div>
            <div id="pnlChart" class="chart-pane-pnl"></div>
          </div>
        </div>
      </div>
      <div class="split-divider" id="splitDivider" role="separator" aria-orientation="vertical" aria-label="Ширина таблицы сделок" title="Перетащите · двойной клик — сброс"></div>
      <aside class="trades-panel" id="tradesPanel">
        <div class="trades-panel-head">
          <h2>Сделки</h2>
          <button type="button" class="btn btn-sm" id="btnColumns" title="Столбцы">☰</button>
        </div>
        <div class="column-picker hidden" id="columnPicker"></div>
        <div class="trades-scroll" id="tradesScroll">
          <table class="trades-table" id="tradesTable">
            <thead>
              <tr id="tradesHead"></tr>
            </thead>
            <tbody id="tradesBody"></tbody>
          </table>
        </div>
        <div class="trades-summary" id="tradesSummary">
          <div class="trades-summary-filters" id="tradesRiskFilters">
            <button type="button" class="chip risk-filter active" data-risk-filter="all">Все</button>
            <button type="button" class="chip risk-filter" data-risk-filter="no-red" title="Скрыть сделки High/Critical (score ≥ 4)">Без красной</button>
            <button type="button" class="chip risk-filter" data-risk-filter="only-red" title="Только красная зона">Красная</button>
          </div>
          <div class="trades-summary-scroll" id="tradesSummaryScroll">
            <div class="trades-summary-grid" id="tradesSummaryGrid"></div>
          </div>
        </div>
      </aside>
    </main>

    <footer class="controls">
      <div class="controls-row">
        <div class="trade-actions" id="tradeActions">
          <button type="button" class="btn btn-trade btn-long" id="btnLong" title="Открыть Long на текущем баре">Long</button>
          <button type="button" class="btn btn-trade btn-short" id="btnShort" title="Открыть Short на текущем баре">Short</button>
          <button type="button" class="btn btn-trade btn-close-all" id="btnCloseAll" title="Закрыть открытую позицию">Закрыть все</button>
        </div>
        <div class="transport">
          <button type="button" class="btn" id="btnStart">⏮ В начало</button>
          <button type="button" class="btn" id="btnBack">⏪ −1 бар</button>
          <button type="button" class="btn btn-primary" id="btnPlay">▶ Play</button>
          <button type="button" class="btn" id="btnFwd">⏩ +1 бар</button>
          <button type="button" class="btn" id="btnEnd">⏭ В конец</button>
        </div>
      </div>
      <div class="speeds">
        <span>Скорость:</span>
        <div class="chip-group" id="speedChips"></div>
      </div>
      <div class="scrub-row">
        <input type="range" id="scrub" min="0" max="1000" value="0" />
        <span id="progress">0%</span>
      </div>
    </footer>
  </div>

  <script src="/static/lightweight-charts.standalone.production.js?v=20260717c"></script>
  <script src="/static/replay-engine.js?v=20260717c"></script>
  <script src="/static/chart.js?v=20260717c"></script>
  <script src="/static/app.js?v=20260717c"></script>
</body>
</html>
