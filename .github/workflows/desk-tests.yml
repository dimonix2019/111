name: Desk tests

on:
  push:
    branches:
      - "cursor/desk-*"
    paths:
      - "strategy-web/**"
      - ".github/workflows/desk-tests.yml"
  pull_request:
    branches:
      - "cursor/desk-*"
    paths:
      - "strategy-web/**"
      - ".github/workflows/desk-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strategy-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: strategy-web/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run strategy-web tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q --tb=no --continue-on-collection-errors
