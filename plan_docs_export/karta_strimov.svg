<text x="124" y="622" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif">проектные</text>
<rect x="230" y="584" width="690" height="50" rx="8" fill="#f3f5f8" stroke="#9aa3b2" stroke-width="1"/>
<text x="575" y="614" text-anchor="middle" font-size="13" fill="#3b4454" font-family="DejaVu Sans, Arial, sans-serif">Финансы · Ресурсы · План · Обучение · Закупки · Scope · Отчётность · Регламенты</text>
<rect x="1080" y="96" width="280" height="558" rx="12" fill="#fff8dc" stroke="#f4c542" stroke-width="2"/>
<text x="1220" y="140" text-anchor="middle" font-size="18" fill="#1a2744" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif">ОЭ</text>
<text x="1220" y="168" text-anchor="middle" font-size="13" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">сюда сходятся</text>
<text x="1220" y="186" text-anchor="middle" font-size="13" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">критичные стримы</text>
<rect x="1110" y="220" width="220" height="70" rx="8" fill="#ffffff" stroke="#d4a017" stroke-width="1"/>
<text x="1220" y="250" text-anchor="middle" font-size="13" fill="#1a2744" font-family="DejaVu Sans, Arial, sans-serif">Вехи / КТ проекта</text>
<text x="1220" y="270" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">даты на этой колонке</text>
<rect x="1110" y="310" width="220" height="90" rx="8" fill="#ffffff" stroke="#d8dee8" stroke-width="1"/>
<text x="1220" y="340" text-anchor="middle" font-size="13" fill="#1a2744" font-family="DejaVu Sans, Arial, sans-serif">Пакет в ОЭ</text>
<text x="1220" y="360" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">арх + инфра + ИБ</text>
<text x="1220" y="378" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">+ качество данных</text>
<text x="1220" y="470" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">Общепроектные</text>
<text x="1220" y="488" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">не рисуем 8 веток —</text>
<text x="1220" y="506" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">только если есть</text>
<text x="1220" y="524" text-anchor="middle" font-size="12" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">ваш срок / дэйли</text>
