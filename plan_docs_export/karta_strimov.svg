<line x1="575" y1="176" x2="575" y2="248" stroke="#0e7c7b" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="825" y1="176" x2="825" y2="248" stroke="#0e7c7b" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="325" y1="298" x2="325" y2="370" stroke="#b42318" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="40" y="672" width="1320" height="84" rx="10" fill="#ffffff" stroke="#d8dee8" stroke-width="1"/>
<text x="60" y="702" text-anchor="start" font-size="13" fill="#1a2744" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif">Как читать</text>
<text x="60" y="726" text-anchor="start" font-size="13" fill="#3b4454" font-family="DejaVu Sans, Arial, sans-serif">стрелка — последовательность внутри стрима</text>
<text x="420" y="726" text-anchor="start" font-size="13" fill="#3b4454" font-family="DejaVu Sans, Arial, sans-serif">пунктир — зависимость между стримами / к ОЭ</text>
<text x="860" y="726" text-anchor="start" font-size="13" fill="#3b4454" font-family="DejaVu Sans, Arial, sans-serif">жёлтый блок — фокус этой недели</text>
<text x="60" y="748" text-anchor="start" font-size="13" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">На карте нет почты, чата, протоколов и папок — они живут в реестре как «источник» у задачи.</text>
</svg>
