<text x="725" y="512" text-anchor="middle" font-size="13" fill="#5b6578" font-family="DejaVu Sans, Arial, sans-serif">на карте только если блокирует ОЭ</text>
<rect x="40" y="564" width="1020" height="90" rx="12" fill="#ffffff" stroke="#d8dee8" stroke-width="1"/>
<rect x="40" y="564" width="168" height="90" rx="12" fill="#5b6578"/>
<rect x="148" y="564" width="60" height="90" rx="0" fill="#5b6578"/>
