<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; background: #131722; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    body { position: relative; }
    #chart { width: 100%; height: 100%; min-height: 120px; touch-action: none; }
    #err {
      display: none;
      position: absolute;
      inset: 0;
      padding: 12px;
      color: #f23645;
      font: 12px sans-serif;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #formingHint {
      display: none;
      position: absolute;
      left: 8px;
      bottom: 28px;
      max-width: calc(100% - 88px);
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fcd34d;
      font: 11px/1.35 Roboto, "Noto Sans", sans-serif;
      pointer-events: none;
      z-index: 2;
    }
  </style>
  <!-- INJECT_LIGHTWEIGHT_CHARTS -->
</head>
<body>
  <div id="chart"></div>
  <div id="formingHint"></div>
  <div id="err"></div>
  <script>
    const TV = {
      bg: '#131722',
      grid: '#2a2e39',
      text: '#d1d4dc',
      border: '#2a2e39',
      crosshair: '#758696',
      crosshairLabel: '#2962FF',
      currentZ: '#60A5FA',
      up: '#089981',
      down: '#f23645',
      selected: '#FACC15',
      forming: '#FBBF24',
    };
    const MSK = 'Europe/Moscow';
    const RIGHT_OFFSET_BARS = 18;
    const INITIAL_RIGHT_MARGIN_IN_WINDOW = 0.18;
    const MARKER_HIT_RADIUS_PX = 48;
    const MARKER_HIT_RADIUS_X_PX = 44;
    const MARKER_ENTRY_HIT_RADIUS_X_PX = 56;
    const MAX_ZONE_SERIES = 6;
    const FOLLOW_LIVE_TOLERANCE_BARS = 3;

    let chart = null;
    let series = null;
    let zoneSeries = [];
    let highlightSeries = null;
    let markersPlugin = null;
    let priceLines = [];
    let fitted = false;
    let lastPayloadKey = '';
    let pendingPayload = null;
    let lastMarkers = [];
    let lastTrades = [];
    let lastCandleTimes = [];
    let lastCandles = [];
    let ohlcBound = false;
    let lastPushedOhlcKey = '';
    let selectedTradeId = null;
    let selectedMarkerKey = null;
    let clickBound = false;
    let viewportBound = false;
    let refreshMarkersTimer = 0;
    let replayCursorLine = null;
    let replayMode = false;
    let userInteracting = false;
    let followLive = true;
    let interactEndTimer = 0;
    let savedLogicalRange = null;
    let lastAppliedRightOffset = null;
    let lastChartSize = { w: 0, h: 0 };
    let gestureBound = false;

    function showError(msg) {
      const el = document.getElementById('err');
      el.style.display = 'flex';
      el.textContent = msg;
      console.error(msg);
    }

    function formatTick(time) {
      if (typeof time !== 'number') return '';
      return new Date(time * 1000).toLocaleString('ru-RU', {
        timeZone: MSK,
        day: 'numeric',
        month: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });
    }

    function chartSize() {
      const el = document.getElementById('chart');
      const w = Math.max(el.clientWidth, el.offsetWidth, window.innerWidth || 0, 100);
      const h = Math.max(el.clientHeight, el.offsetHeight, window.innerHeight || 0, 200);
      return { w, h };
    }

    function markerPersistKey(m) {
      const id = m.tradeId || m.text || '';
      return `${id}:${m.isEntry ? 'e' : 'x'}:${m.time}`;
    }

    function tradeById(id) {
      return lastTrades.find((t) => t.id === id) || null;
    }

    function markerChartPrice(m) {
      const trade = tradeById(m.tradeId || m.text);
      if (!trade) return 0;
      return m.isEntry ? trade.entryZ : (trade.exitZ ?? trade.entryZ);
    }

    function markerScreenPosition(m) {
      if (!chart || !series) return null;
      const x = chart.timeScale().timeToCoordinate(m.time);
      if (x == null) return null;
      const price = markerChartPrice(m);
      let y = series.priceToCoordinate(price);
      if (y == null) return null;
      const yOffset = m.isEntry ? (m.position === 'belowBar' ? 18 : -18) : 0;
      return { x, y: y + yOffset };
    }

    function findNearestMarkerAtPoint(point) {
      if (!lastMarkers.length) return null;
      let bestPixel = null;

      for (const m of lastMarkers) {
        const pos = markerScreenPosition(m);
        const x = pos?.x ?? chart.timeScale().timeToCoordinate(m.time);
        if (x == null) continue;

        const dx = Math.abs(point.x - x);
        const hitRadiusXPx = m.isEntry ? MARKER_ENTRY_HIT_RADIUS_X_PX : MARKER_HIT_RADIUS_X_PX;
        let pixelHit = false;
        let pixelScore = Number.POSITIVE_INFINITY;

        if (pos) {
          const dy = Math.abs(point.y - pos.y);
          const dist = Math.hypot(dx, dy);
          pixelHit = dist <= MARKER_HIT_RADIUS_PX || dx <= hitRadiusXPx;
          pixelScore = dx * 1.5 + dy;
        } else {
          pixelHit = dx <= hitRadiusXPx;
          pixelScore = dx;
        }

        if (pixelHit && (!bestPixel || pixelScore < bestPixel.score)) {
          bestPixel = { marker: m, score: pixelScore };
        }
      }

      return bestPixel?.marker ?? null;
    }

    function visibleBarCount() {
      if (!chart) return Math.max(lastCandleTimes.length, 1);
      try {
        const range = chart.timeScale().getVisibleLogicalRange();
        if (range) return Math.max(2, Math.ceil(range.to - range.from + 1));
      } catch (e) {}
      return Math.max(lastCandleTimes.length, 1);
    }

    function markerSizeForViewport(requested) {
      const base = requested || 2;
      const n = visibleBarCount();
      return Math.max(base, Math.min(4, 360 / n));
    }

    function buildMarkerRenderData(markers, selectedKey) {
      return markers.map((m) => {
        const key = markerPersistKey(m);
        const isSelected =
          !!selectedKey &&
          (key === selectedKey ||
            (!!m.tradeId && m.tradeId === selectedTradeId));
        const baseSize = m.size || 2;
        return {
          time: m.time,
          position: m.position,
          color: isSelected ? TV.selected : m.color,
          shape: isSelected && !m.isEntry ? 'square' : m.shape,
          text: m.text || '',
          size: isSelected ? markerSizeForViewport(2.2) : markerSizeForViewport(baseSize),
        };
      });
    }

    function updateHighlightLine() {
      if (!highlightSeries) return;
      if (!selectedTradeId) {
        highlightSeries.setData([]);
        return;
      }
      const trade = tradeById(selectedTradeId);
      if (!trade) {
        highlightSeries.setData([]);
        return;
      }
      const exitTime = trade.exitTime ?? trade.entryTime;
      const exitZ = trade.exitZ ?? trade.entryZ;
      const data = [
        { time: trade.entryTime, value: trade.entryZ },
        { time: exitTime, value: exitZ },
      ].sort((a, b) => a.time - b.time);
      highlightSeries.setData(data);
    }

    function applyMarkerSelection(marker) {
      if (!marker) {
        selectedTradeId = null;
        selectedMarkerKey = null;
      } else {
        selectedTradeId = marker.tradeId || marker.text || null;
        selectedMarkerKey = markerPersistKey(marker);
      }
      updateHighlightLine();
      refreshMarkers();
    }

    function snapMarkersToCandles(markers) {
      if (!lastCandleTimes.length || !markers.length) return markers;
      const set = new Set(lastCandleTimes);
      return markers.map((m) => {
        if (set.has(m.time)) return m;
        let best = lastCandleTimes[0];
        let bestD = Math.abs(best - m.time);
        for (const t of lastCandleTimes) {
          const d = Math.abs(t - m.time);
          if (d < bestD) {
            best = t;
            bestD = d;
          }
        }
        return { ...m, time: best };
      });
    }

    function scheduleRefreshMarkers() {
      if (refreshMarkersTimer) {
        clearTimeout(refreshMarkersTimer);
      }
      refreshMarkersTimer = setTimeout(() => {
        refreshMarkersTimer = 0;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            refreshMarkers();
            updateHighlightLine();
          });
        });
      }, 60);
    }

    function bindViewportMarkerRefresh() {
      if (!chart || viewportBound) return;
      viewportBound = true;
      const ts = chart.timeScale();
      ts.subscribeVisibleLogicalRangeChange(scheduleRefreshMarkers);
      if (typeof ts.subscribeVisibleTimeRangeChange === 'function') {
        ts.subscribeVisibleTimeRangeChange(scheduleRefreshMarkers);
      }
    }

    function refreshMarkers() {
      if (!series) return;
      const markerData = buildMarkerRenderData(
        snapMarkersToCandles(lastMarkers),
        selectedMarkerKey,
      );
      if (!markerData.length) {
        if (markersPlugin) {
          try { markersPlugin.detach(); } catch (e) {}
          markersPlugin = null;
        }
        return;
      }
      if (!LightweightCharts.createSeriesMarkers) return;
      try {
        if (markersPlugin) {
          try { markersPlugin.detach(); } catch (e) {}
          markersPlugin = null;
        }
        markersPlugin = LightweightCharts.createSeriesMarkers(series, markerData);
      } catch (e) {
        console.error('markers', e);
        try {
          markersPlugin = LightweightCharts.createSeriesMarkers(series, markerData);
        } catch (e2) {
          console.error('markers recreate', e2);
        }
      }
    }

    function ohlcKey(c) {
      if (!c) return '';
      return [c.time, c.open, c.high, c.low, c.close].join('|');
    }

    function lastCandle() {
      return lastCandles.length ? lastCandles[lastCandles.length - 1] : null;
    }

    function candleAtParam(param) {
      if (param && series && param.seriesData) {
        try {
          const d = param.seriesData.get(series);
          if (d && typeof d.open === 'number') return d;
        } catch (e) {}
      }
      if (param && param.time != null) {
        for (let i = lastCandles.length - 1; i >= 0; i--) {
          if (lastCandles[i].time === param.time) return lastCandles[i];
        }
      }
      return null;
    }

    function pushOhlc(c) {
      if (!c || typeof c.open !== 'number') return;
      const key = ohlcKey(c);
      if (key === lastPushedOhlcKey) return;
      lastPushedOhlcKey = key;
      try {
        if (window.MoexChartBridge && MoexChartBridge.onOhlc) {
          MoexChartBridge.onOhlc(c.open, c.high, c.low, c.close);
        }
      } catch (e) {}
    }

    function onCrosshairMove(param) {
      const hovered = candleAtParam(param);
      pushOhlc(hovered || lastCandle());
    }

    function bindOhlcCrosshair() {
      if (!chart || ohlcBound) return;
      ohlcBound = true;
      chart.subscribeCrosshairMove(onCrosshairMove);
    }

    function captureLogicalRange() {
      if (!chart) return;
      try {
        const range = chart.timeScale().getVisibleLogicalRange();
        if (range && Number.isFinite(range.from) && Number.isFinite(range.to)) {
          savedLogicalRange = { from: range.from, to: range.to };
        }
      } catch (e) {}
    }

    function isNearRightEdge(range, lastIndex) {
      if (!range || !Number.isFinite(range.to) || !Number.isFinite(lastIndex)) return true;
      return range.to >= lastIndex - FOLLOW_LIVE_TOLERANCE_BARS;
    }

    function setUserInteracting(on) {
      userInteracting = on;
      if (on) {
        followLive = false;
        if (interactEndTimer) {
          clearTimeout(interactEndTimer);
          interactEndTimer = 0;
        }
        captureLogicalRange();
      }
    }

    function onInteractEnd() {
      interactEndTimer = 0;
      userInteracting = false;
      if (chart) {
        try {
          const range = chart.timeScale().getVisibleLogicalRange();
          const lastIndex = Math.max(0, lastCandleTimes.length - 1);
          followLive = isNearRightEdge(range, lastIndex);
          if (range) savedLogicalRange = { from: range.from, to: range.to };
        } catch (e) {}
      }
      const queued = pendingPayload;
      pendingPayload = null;
      if (queued) renderPayload(queued);
    }

    function bindGestureGuards(el) {
      if (!el || gestureBound) return;
      gestureBound = true;
      const start = () => setUserInteracting(true);
      const end = () => {
        if (interactEndTimer) clearTimeout(interactEndTimer);
        interactEndTimer = setTimeout(onInteractEnd, 180);
      };
      el.addEventListener('touchstart', start, { passive: true });
      el.addEventListener('touchmove', start, { passive: true });
      el.addEventListener('touchend', end, { passive: true });
      el.addEventListener('touchcancel', end, { passive: true });
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      window.addEventListener('mouseup', end);
    }

    function applyRightOffsetIfNeeded(data, allowSnap) {
      if (!chart) return;
      const rightOffset = resolveRightOffsetBars(data);
      if (rightOffset === lastAppliedRightOffset) return;
      if (!allowSnap && !followLive) {
        lastAppliedRightOffset = rightOffset;
        return;
      }
      chart.timeScale().applyOptions({ rightOffset });
      lastAppliedRightOffset = rightOffset;
    }

    function restoreOrFollowRange(barCount, data, isFirstFit, barCountChanged) {
      if (!chart) return;
      if (isFirstFit) {
        if (data.window) {
          applyInitialWindow(barCount, data.window.start, data.window.width);
        } else {
          chart.timeScale().fitContent();
        }
        followLive = true;
        captureLogicalRange();
        return;
      }
      if (userInteracting) {
        if (savedLogicalRange) {
          try { chart.timeScale().setVisibleLogicalRange(savedLogicalRange); } catch (e) {}
        }
        return;
      }
      if (followLive) {
        if (barCountChanged) {
          try { chart.timeScale().scrollToRealTime(); } catch (e) {}
        }
        return;
      }
      if (savedLogicalRange) {
        try { chart.timeScale().setVisibleLogicalRange(savedLogicalRange); } catch (e) {}
      }
    }

    function applyCandleData(candles) {
      const prev = lastCandles;
      const canUpdateLast =
        prev.length > 0 &&
        candles.length === prev.length &&
        candles[0].time === prev[0].time &&
        candles[candles.length - 1].time === prev[prev.length - 1].time;
      const canAppend =
        prev.length > 0 &&
        candles.length === prev.length + 1 &&
        candles[0].time === prev[0].time &&
        candles[candles.length - 2].time === prev[prev.length - 1].time;
      if (canUpdateLast) {
        const last = candles[candles.length - 1];
        const prevLast = prev[prev.length - 1];
        if (
          last.open !== prevLast.open ||
          last.high !== prevLast.high ||
          last.low !== prevLast.low ||
          last.close !== prevLast.close ||
          last.color !== prevLast.color
        ) {
          try { series.update(last); } catch (e) { series.setData(candles); }
        }
      } else if (canAppend) {
        try { series.update(candles[candles.length - 1]); } catch (e) { series.setData(candles); }
      } else {
        series.setData(candles);
      }
      lastCandles = candles;
      lastCandleTimes = candles.map((c) => c.time);
    }

    function onChartClick(param) {
      if (!param.point || param.point.x < 0 || param.point.y < 0) {
        applyMarkerSelection(null);
        return;
      }
      const marker = findNearestMarkerAtPoint(param.point);
      if (!marker) {
        applyMarkerSelection(null);
        return;
      }
      const tradeId = marker.tradeId || marker.text;
      if (!tradeById(tradeId)) {
        applyMarkerSelection(null);
        return;
      }
      applyMarkerSelection(marker);
    }

    function ensureChart() {
      if (chart) return true;
      if (typeof LightweightCharts === 'undefined') {
        showError('lightweight-charts не загружен');
        return false;
      }
      const el = document.getElementById('chart');
      const { w, h } = chartSize();
      if (w < 10 || h < 10) return false;

      chart = LightweightCharts.createChart(el, {
        width: w,
        height: h,
        layout: {
          background: { type: LightweightCharts.ColorType.Solid, color: TV.bg },
          textColor: TV.text,
          fontFamily: 'Roboto, "Noto Sans", sans-serif',
          fontSize: 12,
          attributionLogo: false,
        },
        grid: {
          vertLines: { color: TV.grid },
          horzLines: { color: TV.grid },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: {
            color: TV.crosshair,
            width: 1,
            style: LightweightCharts.LineStyle.LargeDashed,
            labelBackgroundColor: TV.crosshairLabel,
          },
          horzLine: {
            color: TV.crosshair,
            width: 1,
            style: LightweightCharts.LineStyle.LargeDashed,
            labelBackgroundColor: TV.crosshairLabel,
          },
        },
        handleScroll: {
          mouseWheel: false,
          pressedMouseMove: true,
          horzTouchDrag: true,
          vertTouchDrag: false,
        },
        handleScale: {
          axisPressedMouseMove: { time: true, price: true },
          mouseWheel: false,
          pinch: true,
        },
        rightPriceScale: {
          borderColor: TV.border,
          minimumWidth: 72,
          scaleMargins: { top: 0.1, bottom: 0.1 },
        },
        timeScale: {
          borderColor: TV.border,
          timeVisible: true,
          secondsVisible: false,
          rightOffset: RIGHT_OFFSET_BARS,
          shiftVisibleRangeOnNewBar: false,
          lockVisibleTimeRangeOnResize: true,
          rightBarStaysOnScroll: false,
          fixRightEdge: false,
          fixLeftEdge: false,
          tickMarkFormatter: formatTick,
        },
        localization: {
          locale: 'ru-RU',
          timeFormatter: formatTick,
        },
      });

      for (let i = 0; i < MAX_ZONE_SERIES; i++) {
        zoneSeries.push(chart.addSeries(LightweightCharts.HistogramSeries, {
          color: 'rgba(0,0,0,0)',
          base: 0,
          priceLineVisible: false,
          lastValueVisible: false,
          crosshairMarkerVisible: false,
        }));
      }

      series = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: TV.up,
        downColor: TV.down,
        borderUpColor: TV.up,
        borderDownColor: TV.down,
        borderVisible: true,
        wickUpColor: TV.up,
        wickDownColor: TV.down,
        wickVisible: true,
        lastValueVisible: true,
        priceLineVisible: true,
        priceLineWidth: 1,
        priceLineColor: TV.currentZ,
        priceLineStyle: LightweightCharts.LineStyle.Dashed,
      });

      highlightSeries = chart.addSeries(LightweightCharts.LineSeries, {
        color: TV.selected,
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      highlightSeries.setData([]);

      if (!clickBound) {
        chart.subscribeClick(onChartClick);
        clickBound = true;
      }
      bindOhlcCrosshair();

      bindViewportMarkerRefresh();
      bindGestureGuards(el);
      lastAppliedRightOffset = RIGHT_OFFSET_BARS;

      const ro = new ResizeObserver(() => {
        const { w: rw, h: rh } = chartSize();
        if (rw <= 0 || rh <= 0) return;
        if (Math.abs(rw - lastChartSize.w) < 2 && Math.abs(rh - lastChartSize.h) < 2) return;
        if (userInteracting) return;
        lastChartSize = { w: rw, h: rh };
        chart.resize(rw, rh);
        scheduleRefreshMarkers();
      });
      ro.observe(el);
      return true;
    }

    function formatZ(v) {
      if (typeof v !== 'number' || Number.isNaN(v)) return '—';
      return (v >= 0 ? '+' : '') + v.toFixed(2);
    }

    function updateFormingBarHint(data) {
      const el = document.getElementById('formingHint');
      const fb = data && data.formingBar;
      if (!fb || typeof fb.time !== 'number') {
        el.style.display = 'none';
        el.textContent = '';
        return;
      }
      const live = formatZ(fb.liveZ);
      const base = fb.baseCloseZ === null || fb.baseCloseZ === undefined
        ? null
        : formatZ(fb.baseCloseZ);
      const slot = formatTick(fb.time);
      el.textContent = base && Math.abs(fb.liveZ - fb.baseCloseZ) > 0.05
        ? `● Формируется ${slot}: live Z ${live} (закрытый 15м ${base})`
        : `● Формируется ${slot}: live Z ${live}`;
      el.style.display = 'block';
    }

    function dedupeCandles(candles) {
      const byTime = new Map();
      for (const c of candles) {
        if (c && typeof c.time === 'number') byTime.set(c.time, c);
      }
      return [...byTime.entries()].sort((a, b) => a[0] - b[0]).map((x) => x[1]);
    }

    function applyInitialWindow(n, startFrac, widthFrac) {
      if (!chart || n < 2) return;
      const maxIndex = n - 1;
      const width = Math.max(0.05, Math.min(1, widthFrac || 1));
      const visibleBars = Math.max(2, Math.ceil(width * n));
      const startIdx = Math.floor((startFrac || 0) * maxIndex);
      const from = Math.max(0, startIdx);
      const to = Math.min(maxIndex, from + visibleBars - 1);
      const rightGapBars = Math.max(2, Math.ceil(visibleBars * INITIAL_RIGHT_MARGIN_IN_WINDOW));
      chart.timeScale().setVisibleLogicalRange({ from, to: to + rightGapBars });
    }

    function resolveRightOffsetBars(data) {
      if (data && typeof data.rightOffsetBars === 'number' && data.rightOffsetBars > 0) {
        return data.rightOffsetBars;
      }
      return RIGHT_OFFSET_BARS;
    }

    function renderPayload(data) {
      const candles = dedupeCandles(data.candles || []);
      if (!candles.length) return;

      const key = JSON.stringify({
        n: candles.length,
        last: candles[candles.length - 1].time,
        markers: (data.markers || []).length,
        trades: (data.trades || []).length,
      });

      if (!ensureChart()) {
        pendingPayload = data;
        requestAnimationFrame(() => renderPayload(data));
        return;
      }
      pendingPayload = null;
      document.getElementById('err').style.display = 'none';

      const isFirstFit = !fitted;
      if (userInteracting && fitted) {
        pendingPayload = data;
        return;
      }
      const prevBarCount = lastCandleTimes.length;
      if (!userInteracting) captureLogicalRange();

      const prevTradeId = selectedTradeId;
      lastMarkers = (data.markers || []).map((m) => ({
        time: m.time,
        position: m.position,
        color: m.color,
        shape: m.shape,
        text: m.text || '',
        size: m.size || 1,
        tradeId: m.tradeId || m.text || '',
        isEntry: !!m.isEntry,
      }));
      lastTrades = (data.trades || []).map((t) => ({
        id: t.id,
        entryTime: t.entryTime,
        entryZ: t.entryZ,
        exitTime: t.exitTime === null || t.exitTime === undefined ? null : t.exitTime,
        exitZ: t.exitZ === null || t.exitZ === undefined ? null : t.exitZ,
        open: !!t.open,
      }));

      const zones = (data.zones || []).slice(0, MAX_ZONE_SERIES);
      for (let i = 0; i < zoneSeries.length; i++) {
        const zs = zoneSeries[i];
        const zone = zones[i];
        if (!zone) {
          zs.setData([]);
          continue;
        }
        zs.applyOptions({
          color: zone.color || 'rgba(0,0,0,0)',
          base: zone.low,
        });
        zs.setData(candles.map((c) => ({
          time: c.time,
          value: zone.high,
          color: zone.color || 'rgba(0,0,0,0)',
        })));
      }

      if (prevTradeId && !tradeById(prevTradeId)) {
        selectedTradeId = null;
        selectedMarkerKey = null;
      }

      applyCandleData(candles);
      pushOhlc(lastCandle());
      updateFormingBarHint(data);
      if (markersPlugin) {
        try { markersPlugin.detach(); } catch (e) {}
        markersPlugin = null;
      }
      bindViewportMarkerRefresh();

      for (const pl of priceLines) series.removePriceLine(pl);
      priceLines = [];
      for (const hl of data.hlines || []) {
        priceLines.push(series.createPriceLine({
          price: hl.value,
          color: hl.color,
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dashed,
          axisLabelVisible: true,
          title: hl.title || '',
        }));
      }

      applyRightOffsetIfNeeded(data, isFirstFit);
      restoreOrFollowRange(
        candles.length,
        data,
        isFirstFit,
        candles.length !== prevBarCount,
      );
      if (isFirstFit) {
        const { w, h } = chartSize();
        if (w > 0 && h > 0) {
          lastChartSize = { w, h };
          chart.resize(w, h);
        }
        fitted = true;
      }
      lastPayloadKey = key;

      refreshMarkers();
      updateHighlightLine();
      scheduleRefreshMarkers();
      setTimeout(() => refreshMarkers(), 120);
    }

    function parseUtf8Base64Json(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return JSON.parse(new TextDecoder('utf-8').decode(bytes));
    }

    window.updateMoexChartFromBase64 = function (b64) {
      try {
        window.updateMoexChart(parseUtf8Base64Json(b64));
      } catch (e) {
        showError('base64 decode: ' + e.message);
      }
    };

    window.updateMoexChart = function (payload) {
      try {
        const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
        replayMode = false;
        clearReplayCursorLine();
        renderPayload(data);
      } catch (e) {
        showError('updateMoexChart: ' + e.message);
      }
    };

    function clearReplayCursorLine() {
      if (!series || !replayCursorLine) return;
      try { series.removePriceLine(replayCursorLine); } catch (e) {}
      replayCursorLine = null;
    }

    function drawReplayCursorLine(lastCandle) {
      if (!series || !lastCandle) return;
      clearReplayCursorLine();
      replayCursorLine = series.createPriceLine({
        price: lastCandle.close,
        color: '#FACC15',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Solid,
        axisLabelVisible: true,
        title: 'replay',
      });
    }

    /**
     * Лёгкий путь Bar Replay: только бары ≤ cursor (уже нарезанные на Android),
     * без полного remount WebView. markers/trades — только «случившиеся».
     */
    window.setReplayCursor = function (payload) {
      try {
        const data = typeof payload === 'string' ? JSON.parse(payload) : payload;
        const candles = dedupeCandles(data.candles || []);
        if (!candles.length) return;
        if (!ensureChart()) {
          pendingPayload = data;
          requestAnimationFrame(() => window.setReplayCursor(data));
          return;
        }
        replayMode = true;
        document.getElementById('err').style.display = 'none';
        series.setData(candles);
        lastCandles = candles;
        lastCandleTimes = candles.map((c) => c.time);
        pushOhlc(lastCandle());
        lastMarkers = (data.markers || []).map((m) => ({
          time: m.time,
          position: m.position,
          color: m.color,
          shape: m.shape,
          text: m.text || '',
          size: m.size || 1,
          tradeId: m.tradeId || m.text || '',
          isEntry: !!m.isEntry,
        }));
        lastTrades = (data.trades || []).map((t) => ({
          id: t.id,
          entryTime: t.entryTime,
          entryZ: t.entryZ,
          exitTime: t.exitTime === null || t.exitTime === undefined ? null : t.exitTime,
          exitZ: t.exitZ === null || t.exitZ === undefined ? null : t.exitZ,
          open: !!t.open,
        }));
        for (const pl of priceLines) series.removePriceLine(pl);
        priceLines = [];
        for (const hl of data.hlines || []) {
          priceLines.push(series.createPriceLine({
            price: hl.value,
            color: hl.color,
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: hl.title || '',
          }));
        }
        drawReplayCursorLine(candles[candles.length - 1]);
        const n = candles.length;
        const widthFrac = typeof data.windowWidth === 'number' ? data.windowWidth : 1;
        applyInitialWindow(n, Math.max(0, 1 - widthFrac), widthFrac);
        refreshMarkers();
        updateHighlightLine();
        if (data.playing) {
          /* optional pulse reserved for setReplayPlaying */
        }
      } catch (e) {
        showError('setReplayCursor: ' + e.message);
      }
    };

    window.setReplayCursorFromBase64 = function (b64) {
      try {
        window.setReplayCursor(parseUtf8Base64Json(b64));
      } catch (e) {
        showError('setReplayCursor base64: ' + e.message);
      }
    };

    window.setReplayPlaying = function (playing) {
      try {
        /* Reserved: subtle cursor pulse while Playing */
        if (!replayMode) return;
        void playing;
      } catch (e) {
        console.error('setReplayPlaying', e);
      }
    };

    window.moexChartPageReady = function () {
      if (pendingPayload) {
        if (replayMode) window.setReplayCursor(pendingPayload);
        else renderPayload(pendingPayload);
      }
      if (window.MoexChartBridge && MoexChartBridge.onReady) MoexChartBridge.onReady();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', window.moexChartPageReady);
    } else {
      window.moexChartPageReady();
    }
  </script>
</body>
</html>
